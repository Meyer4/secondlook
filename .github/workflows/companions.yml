name: Verify companion apps
on:
  push:
    branches: [main]
    paths: ['companions/**', 'shared/**', 'site/lib/**', 'scripts/**', 'tests/extension/**', 'playwright.extension.config.js', '.github/workflows/companions.yml', 'package*.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/sync-companions.mjs
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:extension
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: node scripts/sync-companions.mjs
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, APK build, and lint
        working-directory: companions/android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SecondLook-Android-preview-debug
          path: companions/android/app/build/outputs/apk/debug/*.apk
  iphone:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-companions.mjs
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: companions/ios
        run: xcodegen generate
      - name: Choose an available iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/simulators.json') as f: data=json.load(f)
          choices=[d for runtime, devices in sorted(data['devices'].items(),reverse=True) if '.iOS-' in runtime for d in devices if d.get('isAvailable') and 'iPhone' in d['name']]
          if not choices: raise SystemExit('No iPhone simulator is available')
          chosen=choices[0]
          print('Selected:', chosen['name'])
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_ID='+chosen['udid']+'\n')
          PY
      - name: Build app and extensions; run native unit tests
        working-directory: companions/ios
        run: xcodebuild -project SecondLook.xcodeproj -scheme SecondLook -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/SecondLookDerivedData" CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        with:
          name: SecondLook-iPhone-simulator-build-NOT-installable-on-a-phone
          path: ${{ runner.temp }}/SecondLookDerivedData/Build/Products/Debug-iphonesimulator/SecondLook.app
