name: Verify companion apps
on:
  push:
    branches: [main]
    paths: ['companions/**', 'shared/**', 'site/lib/**', 'scripts/**', 'tests/extension/**', 'playwright.extension.config.js', '.github/workflows/companions.yml', 'package*.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/sync-companions.mjs
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:extension
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: node scripts/sync-companions.mjs
      - name: Set up Android SDK tools and packages
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Unit tests, APK build, and lint
        working-directory: companions/android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assemblePreview :app:lintPreview
      - name: Inspect the actual preview APK
        run: python3 scripts/verify-android-apk.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SecondLook-Android-preview-nondebuggable
          path: companions/android/app/build/outputs/apk/preview/*.apk
  iphone:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node scripts/sync-companions.mjs
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: companions/ios
        run: xcodegen generate
      - name: Choose an available iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/simulators.json') as f: data=json.load(f)
          choices=[d for runtime, devices in sorted(data['devices'].items(),reverse=True) if '.iOS-' in runtime for d in devices if d.get('isAvailable') and 'iPhone' in d['name']]
          if not choices: raise SystemExit('No iPhone simulator is available')
          chosen=choices[0]
          print('Selected:', chosen['name'])
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_ID='+chosen['udid']+'\n')
          PY
      - name: Build app and extensions; run native unit tests
        working-directory: companions/ios
        run: xcodebuild -project SecondLook.xcodeproj -scheme SecondLook -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/SecondLookDerivedData" CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SecondLook-iPhone-simulator-build-NOT-installable-on-a-phone
          path: ${{ runner.temp }}/SecondLookDerivedData/Build/Products/Debug-iphonesimulator/SecondLook.app
