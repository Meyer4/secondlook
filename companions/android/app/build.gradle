plugins { id 'com.android.application' }
android {
    namespace 'io.github.meyer4.secondlook'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.meyer4.secondlook'
        minSdk 26
        targetSdk 36
        versionCode 130
        versionName '1.3.0'
        resValue 'string', 'app_name', 'SecondLook'
        resValue 'string', 'listener_name', 'SecondLook notification checks'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        preview {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', 'SecondLook Preview'
            resValue 'string', 'listener_name', 'SecondLook Preview notification checks'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { maxHeapSize = "768m"; maxParallelForks = 1 } }
    lint { abortOnError true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
